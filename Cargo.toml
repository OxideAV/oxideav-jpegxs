[package]
name = "oxideav-jpegxs"
version = "0.0.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-jpegxs"
authors = ["Mark Karpeles"]
description = "Pure-Rust JPEG XS (ISO/IEC 21122) low-latency image codec for production / IP video: sample-exact Part-1 decoder (65/65 conformance vectors), Part-1 encoder, Part-2 profiles / levels, Part-3 .jxs file format."

readme = "README.md"
# crates.io 10 MiB cap: the test harnesses and the fuzz sub-crate stay in git only.
exclude = ["/tests", "/fuzz"]
homepage = "https://github.com/OxideAV/oxideav-jpegxs"
keywords = ["multimedia", "image", "jpegxs", "codec"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
# Pulls in `oxideav-core` and exposes the framework `Decoder` / `Encoder`
# adapters, `make_decoder` / `make_encoder`, the frame bridge and the
# `register()` entry point. Disable for an `oxideav-core`-free build: the
# standalone contract API (`probe` / `info` / `decode*` / `encode*`,
# `JpegXsImage`, `EncodeOptions`, …) and every depth module stay available.
registry = ["dep:oxideav-core"]
